<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS-Forward</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #303030;
  color: #c8c8c8;
  font-family: Arial, sans-serif;
  font-size: 12px;
}

.header {
  height: 42px;
  background: #3549a5;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 17px;
  color: white;
  border-bottom: 1px solid #6476c5;
}

.header .menu {
  font-size: 17px;
}

.header .title {
  font-size: 13px;
  flex: 1;
}

.warning {
  color: #ffd42a;
  font-size: 16px;
}

.account {
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 9px;
  gap: 10px;
  color: #ddd;
}

.pink-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ec368b;
}

.account-name {
  flex: 1;
  font-size: 12px;
}

.icon-btn {
  border: 0;
  background: #424242;
  color: #eee;
  height: 27px;
  width: 27px;
  font-size: 15px;
}

.settings {
  display: none;
  padding: 10px 8px 75px;
}

.settings.show {
  display: block;
}

.input-name {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #999;
  color: #ddd;
  outline: none;
  padding: 5px 0;
  font-size: 12px;
  margin-bottom: 19px;
}

.section-title {
  font-size: 11px;
  color: #bdbdbd;
  margin: 13px 0 8px;
}

.option {
  display: flex;
  align-items: center;
  min-height: 27px;
  gap: 7px;
  color: #bdbdbd;
  font-size: 11px;
}

.option input {
  width: 14px;
  height: 14px;
  accent-color: #ed398e;
}

.select-row {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #c3c3c3;
}

.select-row select {
  background: transparent;
  border: none;
  color: #ccc;
  outline: none;
  font-size: 11px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 55px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #303030;
}

.active-btn {
  background: #4057b7;
  color: white;
  border: none;
  border-radius: 18px;
  padding: 9px 15px;
  font-size: 11px;
}

.active-btn.on {
  background: #4057b7;
}

.add-btn {
  position: absolute;
  right: 12%;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #ed398e;
  color: white;
  border: none;
  font-size: 26px;
}

.page-actions {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 49px;
  display: none;
  gap: 5px;
  padding: 5px;
  background: #303030;
}

.page-actions.show {
  display: flex;
}

.page-actions button {
  flex: 1;
  background: #505050;
  color: white;
  border: 0;
  font-size: 11px;
}

.page-actions .next {
  background: #555;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header class="header">
  <span onclick="home()" class="menu">☰</span>
  <span class="title" id="pageTitle">Filters</span>
  <span class="warning">▲</span>
</header>

<main id="homePage">

  <div class="account">
    <span class="pink-dot"></span>
    <span class="account-name">SMS-Forward</span>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
    <button class="icon-btn" onclick="removeAccount()">▣</button>
  </div>

</main>

<section class="settings" id="settingsPage">

  <input
    class="input-name"
    type="text"
    value="SMS-Forward"
    placeholder="Account name"
  >

  <div class="section-title">Notification Preferences</div>

  <label class="option">
    <input type="checkbox" checked>
    General notifications
  </label>

  <label class="option">
    <input type="checkbox" checked>
    Connection alerts
  </label>

  <label class="option">
    <input type="checkbox">
    Error notifications
  </label>

  <div class="section-title">Message Filters</div>

  <label class="option">
    <input type="checkbox" checked>
    Exclude OTP messages
  </label>

  <label class="option">
    <input type="checkbox" checked>
    Exclude banking messages
  </label>

  <div class="section-title">Connection Settings</div>

  <div class="select-row">
    <span>Connection mode</span>
    <select>
      <option>Demo mode</option>
      <option>Disconnected</option>
    </select>
  </div>

  <div class="section-title">Service Settings</div>

  <label class="option">
    <input type="checkbox" checked>
    Show connection status
  </label>

</section>

<footer class="bottom" id="homeBottom">
  <button class="active-btn" id="activeButton"
    onclick="toggleService()">
    Forwarding inactive ▼
  </button>

  <button class="add-btn" onclick="openSettings()">+</button>
</footer>

<div class="page-actions" id="settingsActions">
  <button onclick="home()">‹ CANCEL</button>
  <button class="next" onclick="saveSettings()">SAVE ›</button>
</div>

<script>
let serviceActive = false;

function openSettings() {
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("homeBottom").classList.add("hidden");

  document.getElementById("settingsPage").classList.add("show");
  document.getElementById("settingsActions").classList.add("show");

  document.getElementById("pageTitle").textContent =
    "Main settings (1/1)";
}

function home() {
  document.getElementById("homePage").classList.remove("hidden");
  document.getElementById("homeBottom").classList.remove("hidden");

  document.getElementById("settingsPage").classList.remove("show");
  document.getElementById("settingsActions").classList.remove("show");

  document.getElementById("pageTitle").textContent = "Filters";
}

function toggleService() {
  serviceActive = !serviceActive;

  const button = document.getElementById("activeButton");

  button.textContent = serviceActive
    ? "Forwarding active ▼"
    : "Forwarding inactive ▼";
}

function saveSettings() {
  alert("Settings saved in demo mode.");
  home();
}

function removeAccount() {
  if (confirm("Remove this demo profile?")) {
    document.querySelector(".account").classList.add("hidden");
  }
}
</script>

</body>
</html>
