<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS-Forward</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #303030;
  color: #eee;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

.topbar {
  height: 48px;
  background: #3549a5;
  display: flex;
  align-items: center;
  padding: 0 15px;
  gap: 17px;
  box-shadow: 0 2px 5px #111;
}

.menu {
  font-size: 21px;
  cursor: pointer;
}

.topbar-title {
  font-size: 15px;
  flex: 1;
}

.warning {
  color: #ffdb36;
  font-size: 19px;
}

.account {
  height: 49px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  border-bottom: 1px solid #454545;
}

.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ec3e91;
}

.account-name {
  flex: 1;
  font-size: 13px;
}

.small-btn {
  border: 0;
  background: #424242;
  color: white;
  width: 29px;
  height: 29px;
  border-radius: 3px;
  font-size: 17px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 57px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(transparent, #303030 35%);
}

.status {
  background: #4057bd;
  color: white;
  border: none;
  padding: 10px 17px;
  border-radius: 16px;
  font-size: 12px;
  cursor: pointer;
}

.add {
  position: absolute;
  right: 13%;
  width: 43px;
  height: 43px;
  border: none;
  border-radius: 50%;
  background: #ec3e91;
  color: white;
  font-size: 28px;
  box-shadow: 0 2px 6px #111;
  cursor: pointer;
}

.page {
  display: none;
  padding: 15px;
}

.page.show {
  display: block;
}

.field {
  margin-bottom: 22px;
  font-size: 13px;
}

.field label {
  display: block;
  margin-bottom: 10px;
}

.field input[type=text] {
  width: 100%;
  padding: 9px;
  background: transparent;
  border: none;
  border-bottom: 1px solid #aaa;
  color: white;
  outline: none;
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 13px 0;
  font-size: 13px;
}

input[type=checkbox] {
  accent-color: #ec3e91;
  width: 16px;
  height: 16px;
}

select {
  background: #414141;
  color: white;
  border: 0;
  padding: 9px;
  width: 100%;
}

.actions {
  position: fixed;
  bottom: 60px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 5px;
}

.actions button {
  flex: 1;
  padding: 10px;
  border: 0;
  background: #555;
  color: white;
}

.actions .next {
  background: #4057bd;
}

</style>
</head>

<body>

<header class="topbar">
  <span class="menu" onclick="showHome()">☰</span>
  <span class="topbar-title" id="title">Filters</span>
  <span class="warning">▲</span>
</header>

<!-- Main screen -->
<main id="home">

  <div class="account">
    <span class="dot"></span>
    <span class="account-name">SMS-Forward</span>
    <button class="small-btn" onclick="showSettings()">⚙</button>
    <button class="small-btn" onclick="deleteAccount()">▣</button>
  </div>

</main>

<!-- Settings screen -->
<section id="settings" class="page">

  <div class="field">
    <label>Account name</label>
    <input type="text" value="SMS-Forward">
  </div>

  <div class="field">
    <label>Notification preferences</label>

    <div class="option">
      <input type="checkbox" checked>
      <span>General notifications</span>
    </div>

    <div class="option">
      <input type="checkbox" checked>
      <span>Connection alerts</span>
    </div>

    <div class="option">
      <input type="checkbox">
      <span>Error alerts</span>
    </div>
  </div>

  <div class="field">
    <label>Connection status</label>
    <select>
      <option>Local demo mode</option>
      <option>Disconnected</option>
    </select>
  </div>

  <div class="actions">
    <button onclick="showHome()">CANCEL</button>
    <button class="next" onclick="saveSettings()">SAVE</button>
  </div>

</section>

<footer class="bottom">
  <button class="status" onclick="toggleStatus()">
    <span id="statusText">Service inactive</span> ▼
  </button>

  <button class="add" onclick="showSettings()">+</button>
</footer>

<script>
let active = false;

function showSettings() {
  document.getElementById("home").style.display = "none";
  document.getElementById("settings").classList.add("show");
  document.getElementById("title").textContent = "Main settings";
}

function showHome() {
  document.getElementById("home").style.display = "block";
  document.getElementById("settings").classList.remove("show");
  document.getElementById("title").textContent = "Filters";
}

function toggleStatus() {
  active = !active;
  document.getElementById("statusText").textContent =
    active ? "Service enabled" : "Service inactive";
}

function saveSettings() {
  alert("Settings saved in demo mode.");
  showHome();
}

function deleteAccount() {
  if (confirm("Remove this demo account?")) {
    document.querySelector(".account").style.display = "none";
  }
}
</script>

</body>
</html>
