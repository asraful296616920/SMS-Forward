<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexForward Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0b1020;
  color: #f1f5f9;
  font-family: Arial, sans-serif;
  padding: 22px;
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #60a5fa;
}

.status {
  background: #123c2b;
  color: #4ade80;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

.card {
  background: #151d31;
  border: 1px solid #25314a;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
}

.card h3 {
  margin-bottom: 15px;
  font-size: 17px;
}

.subtitle {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 7px;
}

.main-status {
  font-size: 25px;
  font-weight: bold;
  margin: 12px 0;
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #29344a;
}

.switch-row:last-child {
  border: none;
}

.switch {
  width: 48px;
  height: 26px;
  background: #475569;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
  transition: .2s;
}

.switch::after {
  content: "";
  width: 20px;
  height: 20px;
  background: white;
  position: absolute;
  top: 3px;
  left: 3px;
  border-radius: 50%;
  transition: .2s;
}

.switch.active {
  background: #2563eb;
}

.switch.active::after {
  left: 25px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  font-weight: bold;
  margin-top: 10px;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="logo">NexForward</div>
    <div class="status">● Dashboard</div>
  </div>

  <div class="card">
    <h3>Device Overview</h3>
    <div class="main-status" id="mainStatus">Disabled</div>
    <p class="subtitle">Remote control demonstration</p>
  </div>

  <div class="card">
    <h3>Control Settings</h3>

    <div class="switch-row">
      <span>Service Status</span>
      <div class="switch" data-id="service"></div>
    </div>

    <div class="switch-row">
      <span>Notification Service</span>
      <div class="switch" data-id="notification"></div>
    </div>

    <div class="switch-row">
      <span>Activity Monitoring</span>
      <div class="switch" data-id="monitor"></div>
    </div>
  </div>

  <div class="card">
    <h3>Connection</h3>
    <p class="subtitle" id="connection">
      Dashboard Demo Mode
    </p>
    <button onclick="resetSettings()">Reset Settings</button>
  </div>

  <div class="footer">
    NexForward • Version 1.0.0
    <br><br>
    Secure Control Dashboard
  </div>

</div>

<script>
const switches = document.querySelectorAll(".switch");

switches.forEach(sw => {
  sw.addEventListener("click", () => {
    sw.classList.toggle("active");
    updateStatus();
  });
});

function updateStatus() {
  const service = document.querySelector(
    '[data-id="service"]'
  ).classList.contains("active");

  document.getElementById("mainStatus").textContent =
    service ? "Enabled" : "Disabled";
}

function resetSettings() {
  switches.forEach(sw => {
    sw.classList.remove("active");
  });

  updateStatus();
}
</script>
</body>
</html>
